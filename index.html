<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Surveillance Unit 04 - Night Guard</title>
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
    }
    body {
        background-color: #030303;
        color: #fff;
        font-family: 'Courier New', Courier, monospace;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        overflow: hidden;
    }

    /* ESCRITORIO DE TRABAJO */
    #desk-environment {
        position: relative;
        width: 1280px;
        height: 720px;
        background: radial-gradient(circle at 50% 40%, #1a1818 0%, #050505 80%);
        display: flex;
        justify-content: center;
        align-items: center;
        border: 2px solid #111;
        box-shadow: 0 0 50px rgba(0, 0, 0, 0.9);
    }

    /* MONITOR CRT */
    #crt-monitor {
        position: relative;
        width: 820px;
        height: 580px;
        background: #1a1a1a;
        border-radius: 20px;
        padding: 25px;
        box-shadow: inset 0 0 15px #000, 0 10px 30px rgba(0,0,0,0.8);
        border: 4px solid #2a2a2a;
    }

    #crt-screen {
        position: relative;
        width: 100%;
        height: 100%;
        background: #020804;
        border-radius: 12px;
        overflow: hidden;
        border: 3px solid #111;
        box-shadow: inset 0 0 40px rgba(0,255,100,0.05);
    }

    /* EFECTO SCANLINES CRT */
    .scanlines {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.6) 50%);
        background-size: 100% 4px;
        pointer-events: none;
        z-index: 50;
    }

    /* ENCABEZADO Y HUD SUPERIOR */
    .crt-header {
        position: absolute;
        top: 10px;
        width: 100%;
        text-align: center;
        z-index: 30;
    }

    .crt-title {
        color: #99ff99;
        font-size: 1rem;
        letter-spacing: 2px;
        text-shadow: 0 0 5px #00ff00;
    }

    .crt-subtitle {
        color: #33cc33;
        font-size: 0.85rem;
        margin-top: 3px;
        letter-spacing: 3px;
    }

    /* CUADRÍCULA DE CÁMARAS 2x2 */
    #cams-grid {
        position: absolute;
        top: 50px;
        left: 20px;
        width: 730px;
        height: 360px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 1fr 1fr;
        gap: 8px;
        background: #000;
        padding: 5px;
        border: 2px solid #114411;
    }

    .cam-box {
        position: relative;
        background: #08100a;
        border: 1px solid #1a331a;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .cam-label {
        position: absolute;
        top: 5px;
        left: 5px;
        background: rgba(0,0,0,0.7);
        color: #fff;
        padding: 2px 6px;
        font-size: 0.75rem;
        font-weight: bold;
        z-index: 10;
        border: 1px solid #333;
    }

    .cam-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: grayscale(0.8) contrast(1.4) brightness(0.8);
    }

    /* PANEL INFERIOR DE CÁMARAS E INFORMACIÓN */
    #crt-bottom-panel {
        position: absolute;
        bottom: 15px;
        left: 20px;
        width: 730px;
        height: 130px;
        display: flex;
        justify-content: space-between;
        gap: 10px;
    }

    .info-list {
        width: 40%;
        background: #030a04;
        border: 1px solid #1a331a;
        padding: 10px;
        color: #33cc33;
        font-size: 0.75rem;
        line-height: 1.4;
    }

    .map-box {
        width: 30%;
        background: #030a04;
        border: 1px solid #1a331a;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
    }

    .stats-box {
        width: 28%;
        background: #030a04;
        border: 1px solid #1a331a;
        padding: 10px;
        display: flex;
        flex-direction: column;
        justify-content: space-around;
        color: #33cc33;
        font-size: 0.8rem;
    }

    .stat-bar {
        width: 100%;
        height: 12px;
        background: #0a1a0d;
        border: 1px solid #1a441a;
        margin-top: 3px;
        position: relative;
    }

    .stat-fill {
        height: 100%;
        background: #33cc33;
        width: 100%;
    }

    /* LUZ "DOOR CLOSED" EN LA PARED DE LA DERECHA */
    #door-closed-sign {
        position: absolute;
        right: 120px;
        top: 140px;
        width: 120px;
        height: 80px;
        background: #110000;
        border: 3px solid #330000;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
        color: #550000;
        font-weight: bold;
        font-size: 0.9rem;
        box-shadow: 0 0 10px rgba(0,0,0,0.8);
    }

    #door-closed-sign.active {
        background: #660000;
        border-color: #ff0000;
        color: #ffffff;
        box-shadow: 0 0 25px #ff0000;
        text-shadow: 0 0 8px #ffaaaa;
    }

    /* ELEMENTOS DE ESCRITORIO (TAZA Y TECLADO) */
    #desk-mug {
        position: absolute;
        right: 100px;
        bottom: 80px;
        width: 70px;
        height: 85px;
        background: #2a2a2a;
        border-radius: 5px 5px 15px 15px;
        border-left: 8px solid #3a3a3a;
        box-shadow: 10px 10px 20px rgba(0,0,0,0.8);
    }

    #desk-keyboard {
        position: absolute;
        bottom: 15px;
        left: 280px;
        width: 580px;
        height: 50px;
        background: #181818;
        border-radius: 4px;
        border: 2px solid #2a2a2a;
        box-shadow: 0 10px 20px rgba(0,0,0,0.9);
        display: flex;
        align-items: center;
        justify-content: space-around;
        padding: 0 10px;
    }

    .key-cap {
        width: 20px;
        height: 20px;
        background: #282828;
        border: 1px solid #383838;
        border-radius: 2px;
    }

    /* JUMPSCARE */
    #jumpscare-screen {
        display: none;
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: #000;
        z-index: 100;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }

    #jumpscare-img {
        width: 100%;
        height: 85%;
        object-fit: contain;
        animation: shake 0.02s infinite alternate;
    }

    @keyframes shake {
        0% { transform: scale(1.2) translate(-20px, 20px); filter: contrast(3) hue-rotate(0deg); }
        100% { transform: scale(1.3) translate(20px, -20px); filter: contrast(4) hue-rotate(40deg); }
    }
</style>
</head>
<body>

<div id="desk-environment">
    <!-- INDICADOR DE PUERTA EN PARED DERECHA -->
    <div id="door-closed-sign">DOOR<br>CLOSED</div>

    <!-- TAZA DE CAFÉ -->
    <div id="desk-mug"></div>

    <!-- MONITOR CRT CENTRAL -->
    <div id="crt-monitor">
        <div id="crt-screen">
            <div class="scanlines"></div>

            <div class="crt-header">
                <div class="crt-title">SURVEILLANCE UNIT 04 - <span id="hour-val">02:47 AM</span></div>
                <div class="crt-subtitle">MONITORING ACTIVE</div>
            </div>

            <!-- MUESTRA DE LAS 4 CÁMARAS -->
            <div id="cams-grid">
                <div class="cam-box" onclick="selectCam(1)">
                    <div class="cam-label">CAMS 1</div>
                    <img id="cam1-img" class="cam-img" src="boiled.jpg" alt="CAM 1">
                </div>
                <div class="cam-box" onclick="selectCam(2)">
                    <div class="cam-label">CAMS 2</div>
                    <img id="cam2-img" class="cam-img" src="locust.jpg" alt="CAM 2">
                </div>
                <div class="cam-box" onclick="selectCam(3)">
                    <div class="cam-label">CAMS 3</div>
                    <div style="color:#1a441a; font-size:0.8rem;">STORAGE B [NO SIGNAL]</div>
                </div>
                <div class="cam-box" onclick="selectCam(4)">
                    <div class="cam-label">CAMS 4</div>
                    <div style="color:#1a441a; font-size:0.8rem;">EXIT STAIRS [OFFLINE]</div>
                </div>
            </div>

            <!-- PANEL INFERIOR -->
            <div id="crt-bottom-panel">
                <div class="info-list">
                    <strong>LOWER HALLWAY [SELECTED]</strong><br>
                    STORAGE B<br>
                    SERVER ROOM [OFFLINE]<br>
                    EXIT STAIRS
                </div>
                <div class="map-box">
                    <svg width="100" height="70" viewBox="0 0 100 70">
                        <rect x="10" y="10" width="30" height="20" fill="none" stroke="#33cc33" stroke-width="1"/>
                        <rect x="50" y="10" width="30" height="20" fill="none" stroke="#33cc33" stroke-width="1"/>
                        <rect x="30" y="40" width="40" height="20" fill="none" stroke="#33cc33" stroke-width="1"/>
                        <line x1="25" y1="30" x2="25" y2="40" stroke="#33cc33"/>
                        <line x1="65" y1="30" x2="65" y2="40" stroke="#33cc33"/>
                    </svg>
                </div>
                <div class="stats-box">
                    <div>
                        POWER
                        <div class="stat-bar"><div id="power-bar-fill" class="stat-fill"></div></div>
                    </div>
                    <div>
                        OXYGEN
                        <div class="stat-bar"><div class="stat-fill" style="width: 80%;"></div></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- TECLADO EN EL ESCRITORIO -->
    <div id="desk-keyboard">
        <div class="key-cap"></div><div class="key-cap"></div><div class="key-cap"></div>
        <div class="key-cap" style="width: 100px;"></div>
        <div class="key-cap"></div><div class="key-cap"></div>
    </div>

    <!-- PANTALLA DE JUMPSCARE -->
    <div id="jumpscare-screen">
        <img id="jumpscare-img" src="" alt="Jumpscare">
        <h1 style="color: red; margin-top: 15px; letter-spacing: 4px; text-shadow: 0 0 20px red; font-size: 2rem;">TE HAS CONVERTIDO EN TESTIGO</h1>
        <button style="margin-top: 15px; background: #660000; color: #fff; border: 1px solid #aaa; padding: 10px 20px; font-family: inherit; cursor: pointer;" onclick="location.reload()">REINTENTAR NOCHE</button>
    </div>
</div>

<script>
    const imgBoiledOne = "boiled.jpg"; 
    const imgLocust = "locust.jpg";

    let power = 100;
    let doorClosed = false;
    let gameOver = false;

    let boiledOnePos = 0; 
    let locustPos = 0;

    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
        if (!audioCtx) audioCtx = new AudioCtx();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playScreamSound() {
        try {
            initAudio();
            const now = audioCtx.currentTime;
            
            const osc1 = audioCtx.createOscillator();
            osc1.type = 'sawtooth';
            osc1.frequency.setValueAtTime(2200, now);
            osc1.frequency.exponentialRampToValueAtTime(100, now + 2.5);

            const osc2 = audioCtx.createOscillator();
            osc2.type = 'square';
            osc2.frequency.setValueAtTime(2400, now);
            osc2.frequency.exponentialRampToValueAtTime(80, now + 2.5);

            const bufferSize = audioCtx.sampleRate * 2.5;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = Math.random() * 2 - 1;
            }
            const noiseNode = audioCtx.createBufferSource();
            noiseNode.buffer = buffer;

            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(1.0, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 2.5);

            osc1.connect(gain);
            osc2.connect(gain);
            noiseNode.connect(gain);
            gain.connect(audioCtx.destination);

            osc1.start(now);
            osc2.start(now);
            noiseNode.start(now);

            osc1.stop(now + 2.5);
            osc2.stop(now + 2.5);
            noiseNode.stop(now + 2.5);
        } catch(e){}
    }

    function playBreathingSound() {
        try {
            initAudio();
            const now = audioCtx.currentTime;

            const bufferSize = audioCtx.sampleRate * 1.5;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = Math.random() * 2 - 1;
            }

            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.setValueAtTime(250, now);
            filter.frequency.linearRampToValueAtTime(550, now + 0.7);
            filter.frequency.linearRampToValueAtTime(180, now + 1.5);
            filter.Q.value = 3.5;

            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(0.05, now);
            gain.gain.linearRampToValueAtTime(0.4, now + 0.7);
            gain.gain.linearRampToValueAtTime(0.01, now + 1.5);

            noise.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);

            noise.start(now);
            noise.stop(now + 1.5);
        } catch(e){}
    }

    function toggleDoor() {
        if (gameOver) return;
        initAudio();
        doorClosed = !doorClosed;
        document.getElementById('door-closed-sign').classList.toggle('active', doorClosed);
    }

    function selectCam(camNum) {
        initAudio();
        if (camNum === 1 || camNum === 2) {
            playBreathingSound();
        }
    }

    setInterval(() => {
        if (gameOver) return;

        if (Math.random() < 0.3) {
            if (boiledOnePos === 0) boiledOnePos = 1;
            else if (boiledOnePos === 1) {
                if (!doorClosed) triggerJumpscare('boiled');
                else boiledOnePos = 0;
            }
        }

        if (Math.random() < 0.3) {
            if (locustPos === 0) locustPos = 1;
            else if (locustPos === 1) {
                if (!doorClosed) triggerJumpscare('locust');
                else locustPos = 0;
            }
        }

        document.getElementById('cam1-img').style.display = (boiledOnePos === 0) ? 'block' : 'none';
        document.getElementById('cam2-img').style.display = (locustPos === 0) ? 'block' : 'none';
    }, 4000);

    setInterval(() => {
        if (gameOver) return;

        let usage = doorClosed ? 2 : 1;
        power -= usage * 0.1;
        document.getElementById('power-bar-fill').style.width = Math.max(0, power) + "%";

        if (power <= 0) {
            triggerJumpscare('boiled');
        }
    }, 1000);

    function triggerJumpscare(monster) {
        gameOver = true;
        playScreamSound();
        document.getElementById('jumpscare-screen').style.display = 'flex';
        document.getElementById('jumpscare-img').src = (monster === 'boiled') ? imgBoiledOne : imgLocust;
    }

    window.addEventListener('click', initAudio, { once: true });
    window.addEventListener('keydown', (e) => {
        initAudio();
        if (e.key === ' ') toggleDoor();
    });
</script>
</body>
</html>
